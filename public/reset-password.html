<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose a New Password — College Golf Metrics</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  body { display:flex; flex-direction:column; min-height:100vh; background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%); }
  .auth-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
  .auth-card { background:#fff; border-radius:16px; padding:40px 36px; width:100%; max-width:420px; box-shadow:0 8px 32px rgba(0,0,0,.2); }
  .auth-logo { text-align:center; margin-bottom:28px; }
  .auth-logo a { font-size:22px; font-weight:800; color: var(--green-dark); text-decoration:none; }
  .auth-logo a span { color: var(--gold); }
  h1 { font-size:22px; font-weight:800; color: var(--green-dark); margin-bottom:10px; text-align:center; }
  .lede { font-size:13.5px; color: var(--muted); text-align:center; margin-bottom:22px; line-height:1.6; }
  .auth-footer { text-align:center; margin-top:20px; font-size:13px; color: var(--muted); }
  .auth-footer a { color: var(--green-mid); font-weight:600; }
  #msg { border-radius:8px; padding:12px 14px; font-size:13px; margin-bottom:16px; display:none; line-height:1.55; }
  #msg.err { background:#fde8ea; color: var(--red); }
  #msg.ok  { background:#e6f6ec; color:#0a7d3c; }
  .hint { font-size:12px; color: var(--muted); margin-top:6px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><a href="/">⛳ College Golf <span>Metrics</span></a></div>
    <h1>Choose a new password</h1>
    <p class="lede" id="lede">Pick something at least 8 characters long.</p>
    <div id="msg"></div>
    <form id="reset-form">
      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password" minlength="8">
        <div class="hint">At least 8 characters.</div>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" name="confirm" placeholder="••••••••" required autocomplete="new-password" minlength="8">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px;" id="submit-btn">Save new password</button>
    </form>
    <div class="auth-footer"><p><a href="/login.html">← Back to log in</a></p></div>
  </div>
</div>
<script>
  const TOKEN = new URLSearchParams(location.search).get('token');
  const msg = document.getElementById('msg');
  if (!TOKEN) {
    document.getElementById('reset-form').style.display='none';
    document.getElementById('lede').style.display='none';
    msg.className='err';
    msg.innerHTML = 'This link is missing its reset token. <a href="/forgot-password.html">Request a new one</a>.';
    msg.style.display='block';
  }

  document.getElementById('reset-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const pw = e.target.password.value, confirm = e.target.confirm.value;
    msg.style.display='none';
    if (pw !== confirm) { msg.className='err'; msg.textContent="Those passwords don't match."; msg.style.display='block'; return; }
    btn.textContent='Saving…'; btn.disabled=true;
    try {
      const res = await fetch('/api/auth/reset-password', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ token: TOKEN, password: pw }),
      });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) {
        msg.className='err';
        msg.innerHTML = (data.error || 'Could not reset your password.') + ' <a href="/forgot-password.html">Request a new link</a>.';
        msg.style.display='block'; btn.textContent='Save new password'; btn.disabled=false; return;
      }
      document.getElementById('reset-form').style.display='none';
      document.getElementById('lede').style.display='none';
      msg.className='ok';
      msg.innerHTML = 'Password updated. <a href="/login.html">Log in</a> with your new password.';
      msg.style.display='block';
      setTimeout(()=>{ window.location.href='/login.html'; }, 2500);
    } catch {
      msg.className='err'; msg.textContent='Network error. Please try again.';
      msg.style.display='block'; btn.textContent='Save new password'; btn.disabled=false;
    }
  });
</script>
</body>
</html>
