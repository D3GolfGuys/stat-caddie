<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — College Golf Metrics</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  body { display:flex; flex-direction:column; min-height:100vh; background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%); }
  .auth-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:32px 16px; }
  .auth-card { background:#fff; border-radius:16px; padding:40px 36px; width:100%; max-width:420px; box-shadow:0 8px 32px rgba(0,0,0,.2); }
  .auth-logo { text-align:center; margin-bottom:28px; }
  .auth-logo a { font-size:22px; font-weight:800; color: var(--green-dark); text-decoration:none; }
  .auth-logo a span { color: var(--gold); }
  h1 { font-size:22px; font-weight:800; color: var(--green-dark); margin-bottom:10px; text-align:center; }
  .lede { font-size:13.5px; color: var(--muted); text-align:center; margin-bottom:22px; line-height:1.6; }
  .auth-footer { text-align:center; margin-top:20px; font-size:13px; color: var(--muted); }
  .auth-footer a { color: var(--green-mid); font-weight:600; }
  #msg { border-radius:8px; padding:12px 14px; font-size:13px; margin-bottom:16px; display:none; line-height:1.55; }
  #msg.err { background:#fde8ea; color: var(--red); }
  #msg.ok  { background:#e6f6ec; color:#0a7d3c; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><a href="/">⛳ College Golf <span>Metrics</span></a></div>
    <h1>Forgot your password?</h1>
    <p class="lede">Enter the email address on your account and we'll send you a link to choose a new password.</p>
    <div id="msg"></div>
    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:4px;" id="submit-btn">Send reset link</button>
    </form>
    <div class="auth-footer">
      <p><a href="/login.html">← Back to log in</a></p>
      <p style="margin-top:6px;">Stuck? <a href="mailto:admin@collegegolfmetrics.com">admin@collegegolfmetrics.com</a></p>
    </div>
  </div>
</div>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn'), msg = document.getElementById('msg');
    msg.style.display='none';
    btn.textContent='Sending…'; btn.disabled=true;
    try {
      const res = await fetch('/api/auth/forgot-password', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: e.target.email.value }),
      });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) {
        msg.className='err'; msg.textContent = data.error || 'Something went wrong. Try again.';
        msg.style.display='block'; btn.textContent='Send reset link'; btn.disabled=false; return;
      }
      msg.className='ok';
      msg.innerHTML = 'Check your inbox — if that email has an account, a reset link is on its way. It expires in an hour.';
      msg.style.display='block';
      e.target.reset();
      btn.textContent='Sent'; // stays disabled; rate limit is 20 per 15 min
    } catch {
      msg.className='err'; msg.textContent='Network error. Please try again.';
      msg.style.display='block'; btn.textContent='Send reset link'; btn.disabled=false;
    }
  });
</script>
</body>
</html>
